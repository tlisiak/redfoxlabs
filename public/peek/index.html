<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peek</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.png" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="description" content="Live windows to the world. A live window somewhere beautiful on Earth.">
<!-- YouTube embeds fail with Error 153 without a referrer -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Josefin+Sans:wght@500;600;700&family=Libre+Franklin:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  /* Vintage travel poster: flat printing inks on poster stock, condensed deco capitals,
     ticket stubs and postmarks. The live view is always a clean 16:9 window in a poster frame.
     YouTube's embed rules: nothing may sit in front of the player, crop it, filter it or block
     its links, and only one player may autoplay, only once it's visible. So every control and
     the info card live around the frame, never on it. */
  :root {
    --cream: #f1e4c6;      /* poster stock */
    --cream-2: #e7d5ae;    /* aged stock, tickets */
    --navy: #1e2b45;       /* key-line ink */
    --navy-deep: #141d31;
    --sun: #e1552c;        /* vermilion */
    --gold: #f0a830;       /* marigold */
    --teal: #2b7a74;
    --sky: #9fcad3;
    --ink-soft: #55607a;
    --display: "Big Shoulders Display", "Oswald", "Arial Narrow", Impact, sans-serif;
    --label: "Josefin Sans", "Futura", "Century Gothic", "Avenir", sans-serif;
    --body: "Libre Franklin", "Franklin Gothic Book", "Helvetica Neue", Arial, sans-serif;
    --panel-w: 390px;
    /* poster frame around the live view on the landing page */
    --fx: max(28px, calc((100vw - 1180px) / 2));
    --ft: 74px;
    --fb: clamp(190px, 27vh, 250px);
    color-scheme: light;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--cream); color: var(--navy); font: 15px/1.55 var(--body); -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  /* paper grain over everything printed */
  /* paper grain sits under the frame (z 0), never over the video */
  .grain { position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .28; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .12 0 0 0 0 .1 0 0 0 0 .08 0 0 0 .5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  /* ---------- the frame ---------- */
  /* Positioned by layout() as an exact 16:9 box; it glides between the poster and viewing spots. */
  .stage {
    position: fixed; z-index: 1; overflow: hidden; background: var(--sky);
    border: 3px solid var(--navy); border-radius: 4px; box-sizing: content-box;
    box-shadow: 0 0 0 7px var(--cream), 0 0 0 10px var(--navy);
    transition: left .9s cubic-bezier(.6,0,.2,1), top .9s cubic-bezier(.6,0,.2,1), width .9s cubic-bezier(.6,0,.2,1), height .9s cubic-bezier(.6,0,.2,1);
  }
  /* painted scene behind the player: what the frame shows while tuning in, or without a stream */
  .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
  .tuning {
    position: absolute; left: 50%; top: 18%; transform: translateX(-50%); white-space: nowrap;
    padding: 7px 12px 6px; background: var(--navy); color: var(--cream);
    font: 700 11px/1 var(--label); letter-spacing: .24em; text-transform: uppercase;
  }
  .tuning:empty { display: none; }
  .layer { position: absolute; inset: 0; }
  .layer iframe, .layer .yt-slot { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

  /* ---------- landing poster ---------- */
  .landing { position: fixed; inset: 0; z-index: 2; pointer-events: none; transition: opacity .5s ease; }
  .landing > * { pointer-events: auto; }
  .landing.gone { opacity: 0; }
  .landing.gone > * { pointer-events: none; }
  .topline {
    position: absolute; top: 0; left: var(--fx); right: var(--fx); height: var(--ft);
    display: flex; align-items: center; justify-content: center; gap: 16px;
    font: 700 13px/1 var(--label); letter-spacing: .32em; text-transform: uppercase; padding-top: 4px;
  }
  .topline .mid { display: flex; align-items: center; gap: 14px; }
  .topline .star { color: var(--sun); letter-spacing: 0; font-size: 15px; }
  .poster-foot {
    position: absolute; left: var(--fx); right: var(--fx); bottom: 0; height: var(--fb);
    display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 12px 40px; padding-top: 6px;
  }
  .wordmark {
    font: 900 clamp(110px, 16vw, 200px)/.8 var(--display); letter-spacing: .01em; color: var(--navy);
    text-shadow: 6px 6px 0 var(--sun); margin-top: -.08em;
  }
  .pitch { display: grid; gap: 14px; justify-items: start; max-width: 460px; }
  .tagline { font: 600 clamp(17px, 1.7vw, 20px)/1.35 var(--body); text-wrap: balance; }
  .cta {
    display: inline-flex; align-items: stretch; color: var(--cream); filter: drop-shadow(4px 4px 0 var(--navy));
    transition: transform .15s ease, filter .15s ease;
  }
  .cta:hover { transform: translate(-1px, -1px); filter: drop-shadow(6px 6px 0 var(--navy)); }
  .cta:active { transform: translate(2px, 2px); filter: drop-shadow(1px 1px 0 var(--navy)); }
  .cta .main, .cta .stub {
    background: var(--sun);
    -webkit-mask: radial-gradient(circle 7px at 0 50%, transparent 6.5px, #000 7px) left / 51% 100% no-repeat, radial-gradient(circle 7px at 100% 50%, transparent 6.5px, #000 7px) right / 51% 100% no-repeat;
            mask: radial-gradient(circle 7px at 0 50%, transparent 6.5px, #000 7px) left / 51% 100% no-repeat, radial-gradient(circle 7px at 100% 50%, transparent 6.5px, #000 7px) right / 51% 100% no-repeat;
  }
  .cta .sm { display: none; }
  .cta .main { white-space: nowrap; padding: 14px 26px 12px 30px; font: 900 30px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; }
  .cta .stub { padding: 10px 18px 8px 16px; display: grid; place-items: center; border-left: 2px dashed rgba(241,228,198,.7);
    font: 700 10px/1.25 var(--label); letter-spacing: .22em; text-transform: uppercase; text-align: center; }
  .fine { font: 600 11px/1.4 var(--label); letter-spacing: .22em; text-transform: uppercase; color: var(--ink-soft); }
  .fine b { color: var(--sun); font-weight: 700; }
  .fine:empty { display: none; }
  .maker { font: 700 11px/1.4 var(--label); letter-spacing: .22em; text-transform: uppercase; color: var(--navy); text-decoration: none; border-bottom: 2px solid var(--sun); padding-bottom: 1px; }
  .maker:hover { color: var(--sun); }

  /* ---------- departures board ---------- */
  /* A split-flap board that fills the frame between views. It only ever covers the painted scene
     and a hidden, paused player: it slides away before anything plays. */
  .board {
    position: absolute; inset: 0; z-index: 3; display: none; flex-direction: column; justify-content: center;
    gap: 4cqh; padding: 5cqh 4cqw; background: var(--navy-deep); container-type: size;
    transition: transform .5s cubic-bezier(.7,0,.3,1);
  }
  .board.on { display: flex; }
  .board.away { transform: translateY(102%); }
  .board-head {
    display: flex; justify-content: space-between; align-items: baseline; gap: 2cqw;
    font: 700 clamp(8px, 2.1cqw, 14px)/1 var(--label); letter-spacing: .3em; text-transform: uppercase; color: var(--gold);
  }
  .board-head .star { color: var(--sun); letter-spacing: 0; }
  .rows { display: grid; gap: 2.2cqh; }
  .row { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); gap: .45cqw; }
  .cell {
    position: relative; aspect-ratio: 5 / 7; border-radius: 2px; overflow: hidden;
    display: grid; place-items: center; color: var(--cream); background: #0b1120;
    font: 800 calc(100cqw / var(--cols) * .9)/1 var(--display); text-transform: uppercase;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 1px 0 rgba(0,0,0,.4);
  }
  .cell::before { content: ""; position: absolute; inset: 0 0 50% 0; background: rgba(255,255,255,.04); }   /* upper flap */
  .cell::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(0,0,0,.75); }  /* hinge */
  .cell.flip { animation: flap 80ms ease-out; }
  @keyframes flap { from { transform: scaleY(.2); filter: brightness(1.6); } to { transform: none; } }
  .row.country .cell { color: var(--gold); }
  .row.meta .cell { color: rgba(241,228,198,.72); }
  .layer.staged { visibility: hidden; }

  /* ---------- viewing chrome ---------- */
  .chrome { position: fixed; inset: 0; z-index: 4; pointer-events: none; opacity: 0; transition: opacity .6s ease .2s; }
  .chrome.on { opacity: 1; }
  .chrome.on > * { pointer-events: auto; }
  .mini-mark { position: absolute; top: 14px; left: 24px; font: 900 44px/1 var(--display); letter-spacing: .02em; color: var(--navy); text-shadow: 3px 3px 0 var(--sun); }
  /* controls dock just below the frame */
  .dock { position: absolute; left: var(--stage-left, 24px); top: calc(var(--stage-bottom, 70vh) + 24px); display: flex; align-items: center; gap: 18px; }
  .again { position: relative; }
  .again .main { font-size: 22px; padding: 12px 20px 10px 22px; }
  .again .stub { font-size: 9px; padding: 8px 14px 6px 12px; }
  .sound {
    width: 46px; height: 46px; border-radius: 50%; flex: none;
    display: grid; place-items: center; background: var(--cream); color: var(--navy); border: 2px solid var(--navy); box-shadow: 3px 3px 0 var(--navy);
  }

  .panel {
    position: absolute; top: 16px; right: 16px; bottom: 16px; width: var(--panel-w);
    background: var(--cream); color: var(--navy); border: 3px solid var(--navy); border-radius: 6px;
    box-shadow: 6px 6px 0 rgba(20,29,49,.55);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .panel-head { position: relative; padding: 18px 20px 16px; background: var(--navy); color: var(--cream); }
  .eyebrow { display: flex; align-items: center; gap: 10px; font: 700 11px/1 var(--label); letter-spacing: .26em; text-transform: uppercase; color: var(--gold); }
  .live { display: inline-flex; align-items: center; gap: 6px; padding: 4px 7px 3px; background: var(--sun); color: var(--cream); letter-spacing: .18em; }
  .live i { width: 6px; height: 6px; border-radius: 50%; background: var(--cream); animation: blink 1.6s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .p-name { font: 900 40px/.92 var(--display); letter-spacing: .02em; text-transform: uppercase; margin: 12px 0 8px; text-wrap: balance; }
  .mini-title { display: none; }
  .p-place { font: 600 12px/1.4 var(--label); letter-spacing: .18em; text-transform: uppercase; color: rgba(241,228,198,.8); }
  .ticket-row { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 16px; align-items: center; padding: 16px 20px; border-bottom: 2px dashed var(--navy); }
  .postmark {
    width: 92px; height: 92px; border-radius: 50%; border: 3px double var(--sun); color: var(--sun);
    display: grid; place-items: center; align-content: center; gap: 2px; text-align: center; transform: rotate(-8deg);
  }
  .postmark small { font: 700 8.5px/1.1 var(--label); letter-spacing: .14em; text-transform: uppercase; max-width: 70px; overflow-wrap: anywhere; }
  .postmark strong { font: 900 25px/1 var(--display); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  .stats { display: grid; gap: 8px; min-width: 0; }
  .stat { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 8px; align-items: baseline; }
  .stat small { font: 700 10px/1.2 var(--label); letter-spacing: .18em; text-transform: uppercase; color: var(--ink-soft); }
  .stat span { font: 600 14px/1.3 var(--body); font-variant-numeric: tabular-nums; min-width: 0; }
  .stat a { text-decoration: none; border-bottom: 1px solid var(--sun); }
  .panel-body { overflow-y: auto; padding: 4px 20px 20px; scrollbar-width: thin; scrollbar-color: var(--navy) transparent; }
  .headline { font: italic 400 17px/1.45 var(--body); margin: 16px 0 2px; }
  .sec { margin-top: 18px; }
  .sec h3 { display: flex; align-items: center; gap: 10px; font: 700 11px/1 var(--label); letter-spacing: .24em; text-transform: uppercase; color: var(--sun); margin-bottom: 8px; }
  .sec h3::after { content: ""; flex: 1; height: 2px; background: var(--sun); opacity: .35; }
  .sec p { color: var(--navy); }
  .sec ul { list-style: none; display: grid; gap: 6px; }
  .sec li { padding-left: 18px; position: relative; }
  .sec li::before { content: "✦"; position: absolute; left: 0; top: 0; font-size: 11px; color: var(--teal); }
  .credit { margin-top: 22px; padding-top: 12px; border-top: 2px dashed var(--navy); font-size: 12px; color: var(--ink-soft); display: grid; gap: 6px; }
  .credit a { color: var(--navy); text-decoration: none; border-bottom: 1px solid var(--sun); }

  .toast {
    position: fixed; z-index: 7; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-2deg); max-width: min(420px, calc(100vw - 32px));
    padding: 18px 22px; background: var(--cream); color: var(--navy); border: 3px solid var(--navy); box-shadow: 6px 6px 0 var(--sun);
    font: 600 16px/1.4 var(--body); text-align: center; display: none;
  }
  .toast.on { display: block; }

  /* ---------- phones: frame on top, poster type / info card below it ---------- */
  @media (max-width: 760px) {
    :root { --fx: 16px; --ft: 54px; --fb: 290px; }
    .topline { justify-content: center; font-size: 11px; letter-spacing: .26em; }
    .poster-foot { top: calc(var(--stage-bottom, 300px) + 30px); bottom: auto; height: auto; grid-template-columns: 1fr; gap: 12px; }
    .wordmark { font-size: 96px; text-shadow: 4px 4px 0 var(--sun); }
    .tagline { font-size: 16px; }
    .cta .main { font-size: 26px; }
    .panel { top: calc(var(--stage-bottom, 300px) + 22px); left: 12px; right: 12px; bottom: 12px; width: auto; }
    .panel-head { padding: 14px 16px 12px; }
    .p-name { font-size: 30px; margin-top: 8px; }
    .ticket-row { grid-template-columns: 76px minmax(0, 1fr); padding: 12px 16px; }
    .postmark { width: 76px; height: 76px; }
    .postmark strong { font-size: 20px; }
    /* one scroll for the whole card: the title and weather/sun/bearing roll away as you read,
       and a slim bar keeps the place name pinned once the big title is gone */
    .panel { display: block; overflow-y: auto; overscroll-behavior: contain; }
    .mini-title {
      display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 2;
      height: 44px; margin-bottom: -44px; padding: 0 16px; background: var(--navy); color: var(--cream);
      font: 900 20px/1 var(--display); letter-spacing: .03em; text-transform: uppercase;
      border-bottom: 2px dashed rgba(241,228,198,.25);
      transform: translateY(-100%); transition: transform .25s ease;
    }
    .mini-title .live { font: 700 9px/1 var(--label); letter-spacing: .18em; flex: none; }
    .mini-title #miniName { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .mini-title.show { transform: none; }
    .panel-body { overflow: visible; padding: 4px 16px 16px; }
    .dock { left: auto; right: 12px; top: 10px; gap: 10px; }
    .again .stub, .again .lg { display: none; }
    .again .sm { display: inline; }
    .again .main { -webkit-mask: none; mask: none; font-size: 18px; padding: 10px 14px 8px; }
    .mini-mark { top: 12px; left: 14px; font-size: 32px; }
    .sound { width: 40px; height: 40px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .stage { transition: none; }
    .board { transition: none; }
    .cell.flip { animation: none; }
    .live i { animation: none; }
  }
</style>
</head>
<body class="on-landing">
<div class="grain" aria-hidden="true"></div>

<div class="stage" id="stage">
  <svg class="scene" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <rect width="1200" height="600" fill="var(--sky)"/>
    <g transform="translate(600 420)" fill="var(--gold)" opacity=".5">
      <path id="ray" d="M0 0 L-28 -900 L28 -900 Z"/>
      <use href="#ray" transform="rotate(15)"/><use href="#ray" transform="rotate(30)"/><use href="#ray" transform="rotate(45)"/><use href="#ray" transform="rotate(60)"/><use href="#ray" transform="rotate(75)"/><use href="#ray" transform="rotate(90)"/>
      <use href="#ray" transform="rotate(-15)"/><use href="#ray" transform="rotate(-30)"/><use href="#ray" transform="rotate(-45)"/><use href="#ray" transform="rotate(-60)"/><use href="#ray" transform="rotate(-75)"/><use href="#ray" transform="rotate(-90)"/>
    </g>
    <circle cx="600" cy="420" r="120" fill="var(--sun)"/>
    <path d="M0 360 L170 220 L300 320 L470 170 L640 330 L790 230 L950 330 L1080 250 L1200 300 L1200 600 L0 600 Z" fill="var(--teal)"/>
    <path d="M0 470 C200 420 330 500 520 455 C720 410 860 490 1040 450 C1110 435 1170 440 1200 442 L1200 600 L0 600 Z" fill="var(--navy)"/>
  </svg>
  <div class="tuning" id="tuning"></div>
  <div class="board" id="board" aria-live="polite">
    <div class="board-head"><span><span class="star">★</span> Departures</span><span id="boardNote">Now boarding</span></div>
    <div class="rows" id="boardRows"></div>
  </div>
</div>

<section class="landing" id="landing">
  <div class="topline">
    <span class="mid"><span class="star">★</span>Windows to the world<span class="star">★</span></span>
  </div>
  <div class="poster-foot">
    <h1 class="wordmark">PEEK</h1>
    <div class="pitch">
      <p class="tagline">A live window somewhere beautiful on Earth.</p>
      <button class="cta" id="peekBtn"><span class="main">Take a peek</span><span class="stub">Admit<br>one</span></button>
      <p class="fine" id="countLine"></p>
      <a class="maker" href="/">A Red Fox Labs project</a>
    </div>
  </div>
</section>


<div class="chrome" id="chrome">
  <button class="mini-mark" id="home" aria-label="Back to start">PEEK</button>
  <div class="dock">
    <button class="cta again" id="againBtn"><span class="main"><span class="lg">Peek somewhere else</span><span class="sm">Peek again</span></span><span class="stub">Space</span></button>
    <button class="sound" id="soundBtn" aria-label="Toggle sound" title="Sound"></button>
  </div>
  <aside class="panel" id="panel" aria-live="polite">
    <div class="mini-title" id="miniTitle" aria-hidden="true"><span class="live"><i></i>Live</span><span id="miniName"></span></div>
    <header class="panel-head" id="panelHead">
      <div class="eyebrow"><span class="live"><i></i>Live</span></div>
      <h2 class="p-name" id="pName"></h2>
      <div class="p-place" id="pPlace"></div>
    </header>
    <div class="ticket-row">
      <div class="postmark" aria-label="Local time"><small id="pmPlace"></small><strong id="sTime">–</strong><small id="pmDate"></small></div>
      <div class="stats">
        <div class="stat"><small>Weather</small><span id="sWeather">–</span></div>
        <div class="stat"><small>Sun</small><span id="sSun">–</span></div>
        <div class="stat"><small>Bearing</small><span id="sCoords">–</span></div>
      </div>
    </div>
    <div class="panel-body" id="panelBody"></div>
  </aside>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  const STREAMS = window.PEEK_STREAMS;
  const MIN_SPIN_MS = 1300;   // flaps spin at least this long, so even a fast load feels like a departure
  const HOLD_MS = 900;        // how long the destination stays up before the board drops away
  const LOAD_TIMEOUT_MS = 7000;   // per source; give up on one that won't start and try the next
  const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = (id) => document.getElementById(id);

  // ---------------------------------------------------------------- sun math
  // Solar altitude in degrees for a given instant and place (low-precision almanac, ±0.5°).
  function sunAltitude(date, lat, lng) {
    const rad = Math.PI / 180;
    const d = date.getTime() / 86400000 - 10957.5;            // days since J2000.0
    const g = (357.529 + 0.98560028 * d) * rad;                // mean anomaly
    const q = 280.459 + 0.98564736 * d;                        // mean longitude
    const L = (q + 1.915 * Math.sin(g) + 0.02 * Math.sin(2 * g)) * rad;
    const e = (23.439 - 0.00000036 * d) * rad;                 // obliquity
    const ra = Math.atan2(Math.cos(e) * Math.sin(L), Math.cos(L));
    const dec = Math.asin(Math.sin(e) * Math.sin(L));
    const gmst = (18.697374558 + 24.06570982441908 * d) % 24;
    const ha = (gmst * 15 + lng) * rad - ra;                   // local hour angle
    return Math.asin(Math.sin(lat * rad) * Math.sin(dec) + Math.cos(lat * rad) * Math.cos(dec) * Math.cos(ha)) / rad;
  }
  // Minutes until the sun next crosses the horizon, scanning ahead in 2-minute steps.
  function nextSunEvent(lat, lng) {
    const now = Date.now(), up = sunAltitude(new Date(now), lat, lng) > -0.833;
    for (let m = 2; m <= 36 * 60; m += 2) {
      if ((sunAltitude(new Date(now + m * 60000), lat, lng) > -0.833) !== up) return { up, minutes: m };
    }
    return { up, minutes: null };                              // polar day or night
  }
  const fmtDur = (m) => (m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : `${m}m`);
  const localHour = (tz) => Number(new Intl.DateTimeFormat("en-US", { timeZone: tz, hour: "numeric", hourCycle: "h23" }).format(new Date()));
  const localTime = (tz) => new Intl.DateTimeFormat("en-US", { timeZone: tz, hour: "numeric", minute: "2-digit" }).format(new Date());

  // ---------------------------------------------------------------- picking a view
  // A view is eligible when it's worth looking at right now: inside its camera hours,
  // or with the sun no more than 6° below the horizon (civil twilight counts, it's gorgeous).
  // Golden hour gets triple weight.
  const recent = [];
  function eligible(s) {
    if (s.hours) { const h = localHour(s.tz); return h >= s.hours[0] && h < s.hours[1]; }
    return s.night || sunAltitude(new Date(), s.lat, s.lng) > -6;
  }
  function weight(s) {
    const alt = sunAltitude(new Date(), s.lat, s.lng);
    return alt > -6 && alt < 10 ? 3 : 1;
  }
  function pick(exclude = []) {
    let pool = STREAMS.filter((s) => eligible(s) && !exclude.includes(s.id));
    pool = pool.filter((s) => !s.paused || PeekPlayer.looksAlive(s));
    const alive = pool.filter(PeekPlayer.looksAlive);
    if (alive.length) pool = alive;
    const fresh = pool.filter((s) => !recent.includes(s.id));
    if (fresh.length) pool = fresh;
    if (!pool.length) pool = STREAMS.filter((s) => !s.paused && !exclude.includes(s.id));
    if (!pool.length) return null;
    const total = pool.reduce((t, s) => t + weight(s), 0);
    let r = Math.random() * total;
    for (const s of pool) { r -= weight(s); if (r <= 0) return s; }
    return pool[pool.length - 1];
  }
  function remember(id) { recent.push(id); while (recent.length > Math.min(4, STREAMS.length - 1)) recent.shift(); }

  // ---------------------------------------------------------------- YouTube players
  // Mounts the stream into the (visible) frame and resolves with { layer, player } once one of
  // its sources is actually playing live and on target. Falls through backup IDs and the channel
  // embed. The player is only ever created where it can be seen, as YouTube's autoplay rules require.
  async function loadStream(stream) {
    for (const cand of PeekPlayer.candidates(stream)) {
      const layer = document.createElement("div");
      layer.className = "layer";
      $("stage").appendChild(layer);
      try {
        const { player } = await PeekPlayer.mount(layer, cand, { timeout: LOAD_TIMEOUT_MS, expect: stream.expect });
        return { layer, player };
      } catch (err) {
        layer.remove();
        console.warn(`[peek] ${stream.id}: ${PeekPlayer.label(cand)} failed (${err.message})`);
      }
    }
    throw new Error("no working source");
  }
  function retire(view) {
    if (!view) return;
    try { view.player.destroy(); } catch {}
    view.layer.remove();
  }

  // ---------------------------------------------------------------- the frame
  // The frame is always an exact 16:9 box (so the player is never cropped), placed in the
  // poster on the landing page, or beside the info card while viewing.
  let mode = "landing";
  function frameBox() {
    const W = innerWidth, H = innerHeight, phone = W <= 760;
    let b;
    if (mode === "landing") {
      const fx = phone ? 24 : Math.max(28, (W - 1180) / 2), ft = phone ? 58 : 74;
      const fb = phone ? Math.max(300, H * 0.42) : Math.min(250, Math.max(190, H * 0.27));
      b = { x: fx, y: ft, w: W - 2 * fx, h: H - ft - fb, top: phone };
    } else if (phone) {
      b = { x: 22, y: 72, w: W - 44, h: (W - 44) * 9 / 16, top: true };
    } else {
      b = { x: 34, y: 86, w: W - 390 - 16 - 34 - 44, h: H - 86 - 110, top: false };
    }
    const w = Math.max(200, Math.min(b.w, b.h * 16 / 9)), h = w * 9 / 16;
    return { x: b.x + (b.w - w) / 2, y: b.top ? b.y : b.y + Math.max(0, (b.h - h) / 2), w, h };
  }
  function layout() {
    const r = frameBox(), st = $("stage").style, root = document.documentElement.style;
    st.left = r.x + "px"; st.top = r.y + "px"; st.width = r.w + "px"; st.height = r.h + "px";
    root.setProperty("--stage-left", r.x - 3 + "px");
    root.setProperty("--stage-bottom", r.y + r.h + 13 + "px");   // past the border and double rule
  }
  addEventListener("resize", layout);

  // ---------------------------------------------------------------- departures board
  // Split-flap rows that spin while the next stream warms up, then settle left to right onto
  // the destination. Text is folded to the board's character set (no accents, no ʻokina).
  const FLAPS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789:.·-' ";
  const toBoard = (t) => String(t).normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[ʻʼ’`]/g, "'")
    .replace(/&/g, "AND").toUpperCase().replace(/[^A-Z0-9:.·\-' ]/g, " ").replace(/\s+/g, " ").trim();
  function fit(text, cols) {   // trim at a word boundary when it can
    if (text.length <= cols) return text;
    const cut = text.slice(0, cols + 1).lastIndexOf(" ");
    return text.slice(0, cut > cols * 0.5 ? cut : cols);
  }
  const board = (() => {
    const el = $("board"), rowsEl = $("boardRows");
    let cells = [], cols = 0, spinTimer = 0, settledAt = [], audio = null, lastClack = 0;
    function build() {
      cols = frameBox().w < 520 ? 16 : 20;   // size for where the frame is going, not mid-glide
      el.style.setProperty("--cols", cols);
      rowsEl.innerHTML = "";
      cells = ["country", "name", "meta"].map((kind) => {
        const row = document.createElement("div");
        row.className = "row " + kind;
        rowsEl.appendChild(row);
        return Array.from({ length: cols }, () => { const c = document.createElement("span"); c.className = "cell"; row.appendChild(c); return c; });
      });
    }
    function clack() {   // a soft synthesized flap, only when sound is on and after a click
      if (!wantSound || !audio) return;
      const now = audio.currentTime;
      if (now - lastClack < 0.028) return;
      lastClack = now;
      const len = Math.floor(audio.sampleRate * 0.018), buf = audio.createBuffer(1, len, audio.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 5);
      const src = audio.createBufferSource(), bp = audio.createBiquadFilter(), g = audio.createGain();
      src.buffer = buf; bp.type = "bandpass"; bp.frequency.value = 1800 + Math.random() * 900; bp.Q.value = 1.4; g.gain.value = 0.07;
      src.connect(bp).connect(g).connect(audio.destination); src.start();
    }
    function setCell(c, ch, flip) {
      if (c.textContent === ch) return;
      c.textContent = ch;
      if (flip) { c.classList.remove("flip"); void c.offsetWidth; c.classList.add("flip"); }
    }
    return {
      unlockAudio() {
        try { audio ||= new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch { audio = null; }
      },
      show(note = "Now boarding") {
        build();
        $("boardNote").textContent = note;
        settledAt = [];
        el.classList.remove("away");
        el.classList.add("on");
        if (reducedMotion) return;
        clearInterval(spinTimer);
        spinTimer = setInterval(() => {
          cells.forEach((row) => row.forEach((c) => { if (!c.dataset.done && Math.random() < 0.6) setCell(c, FLAPS[(Math.random() * (FLAPS.length - 1)) | 0], false); }));
          clack();
        }, 90);
      },
      // Resolves once every cell has landed. Cells settle in a cascade: left to right, row by row.
      get cols() { return cols; },
      settle(lines) {
        const text = lines.map((l) => fit(toBoard(l), cols).padEnd(cols, " "));
        return new Promise((resolve) => {
          let last = 0;
          cells.forEach((row, r) => row.forEach((c, i) => {
            const at = reducedMotion ? 0 : r * 160 + i * 38 + Math.random() * 60;
            last = Math.max(last, at);
            setTimeout(() => { c.dataset.done = "1"; setCell(c, text[r][i], true); clack(); }, at);
          }));
          setTimeout(() => { clearInterval(spinTimer); resolve(); }, last + 120);
        });
      },
      hide() {
        clearInterval(spinTimer);
        return new Promise((resolve) => {
          if (!el.classList.contains("on")) return resolve();
          el.classList.add("away");
          setTimeout(() => { el.classList.remove("on", "away"); cells.flat().forEach((c) => delete c.dataset.done); resolve(); }, reducedMotion ? 0 : 520);
        });
      },
    };
  })();
  // Board rows: the place name in its short form ("Mount Fuji over Lake Kawaguchiko" → "MOUNT FUJI"),
  // and the sunset countdown only when it fits beside the local time.
  const shortName = (s) => s.name.split(/,| over | from | & /)[0].replace(/^The /, "");
  function boardLines(s, cols) {
    const name = shortName(s);
    const time = `LOCAL ${localTime(s.tz)}`;
    const ev = nextSunEvent(s.lat, s.lng);
    const sun = ev.minutes == null ? "" : ` · SUN${ev.up ? "SET" : "RISE"} ${fmtDur(ev.minutes).replace(/ /g, "")}`;
    return [s.country, name, toBoard(time + sun).length <= cols ? time + sun : time];
  }

  // ---------------------------------------------------------------- info panel
  let current = null, clockTimer = 0;
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  function renderPanel(s) {
    $("pName").textContent = s.name;
    $("miniName").textContent = shortName(s);
    $("pPlace").textContent = `${s.place} · ${s.country}`;
    $("pmPlace").textContent = s.country;
    const ns = s.lat >= 0 ? "N" : "S", ew = s.lng >= 0 ? "E" : "W";
    $("sCoords").innerHTML = `<a href="https://www.google.com/maps/@${s.lat},${s.lng},12z" target="_blank" rel="noopener" style="text-decoration:none">${Math.abs(s.lat).toFixed(2)}°${ns}, ${Math.abs(s.lng).toFixed(2)}°${ew}</a>`;
    $("sWeather").textContent = "–";
    const list = (items) => `<ul>${items.map((i) => `<li>${esc(i)}</li>`).join("")}</ul>`;
    $("panelBody").innerHTML = `
      <p class="headline">${esc(s.headline)}</p>
      <div class="sec"><h3>What you're looking at</h3><p>${esc(s.looking)}</p></div>
      <div class="sec"><h3>Watch for</h3>${list(s.watchFor)}</div>
      <div class="sec"><h3>The story</h3><p>${esc(s.history)}</p></div>
      ${s.facts?.length ? `<div class="sec"><h3>Worth knowing</h3>${list(s.facts)}</div>` : ""}
      <div class="credit">
        <div>Live stream by <a href="${s.credit.url}" target="_blank" rel="noopener">${esc(s.credit.name)}</a></div>
        <div>Sources: ${s.sources.map((x) => `<a href="${x.url}" target="_blank" rel="noopener">${esc(x.label)}</a>`).join(" · ")}</div>
        <div>Peek is a <a href="/">Red Fox Labs</a> project</div>
      </div>`;
    $("panelBody").scrollTop = 0;
    $("panel").scrollTop = 0;
    tick();
    clearInterval(clockTimer); clockTimer = setInterval(tick, 20000);
    loadWeather(s);
  }
  function tick() {
    if (!current) return;
    const s = current;
    $("sTime").textContent = localTime(s.tz).replace(/\s?[AP]M$/, "");
    $("pmDate").textContent = new Intl.DateTimeFormat("en-GB", { timeZone: s.tz, day: "numeric", month: "short", hour: "numeric", hourCycle: "h12" }).formatToParts(new Date())
      .filter((p) => ["day", "month", "dayPeriod"].includes(p.type)).map((p) => p.value.toUpperCase()).join(" ");
    const ev = nextSunEvent(s.lat, s.lng);
    $("sSun").textContent = ev.minutes == null ? (ev.up ? "Up all day" : "Down all day") : `${ev.up ? "Sets" : "Rises"} in ${fmtDur(ev.minutes)}`;
  }
  // WMO weather codes → words (Open-Meteo uses them)
  const WMO = { 0: "Clear", 1: "Mostly clear", 2: "Partly cloudy", 3: "Overcast", 45: "Fog", 48: "Fog", 51: "Drizzle", 53: "Drizzle", 55: "Drizzle", 61: "Light rain", 63: "Rain", 65: "Heavy rain", 71: "Light snow", 73: "Snow", 75: "Heavy snow", 77: "Snow", 80: "Showers", 81: "Showers", 82: "Downpour", 85: "Snow showers", 86: "Snow showers", 95: "Thunderstorm", 96: "Thunderstorm", 99: "Thunderstorm" };
  async function loadWeather(s) {
    try {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${s.lat}&longitude=${s.lng}&current=temperature_2m,weather_code&temperature_unit=fahrenheit`;
      const res = await fetch(url);
      const j = await res.json();
      if (current !== s) return;
      const f = Math.round(j.current.temperature_2m), c = Math.round((f - 32) * 5 / 9);
      $("sWeather").textContent = `${f}°F · ${WMO[j.current.weather_code] ?? ""}`.replace(/ · $/, "");
      $("sWeather").title = `${c}°C`;
    } catch { /* weather is a nice-to-have */ }
  }

  // ---------------------------------------------------------------- sound
  // Views start muted; the sound button turns sound on (and the flap clack with it).
  // If the browser refuses audible playback, we go back to muted and the toggle shows it.
  let wantSound = false;
  const ICON_ON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 010 7M18.5 5.5a9 9 0 010 13"/></svg>';
  const ICON_OFF = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M22 9l-6 6M16 9l6 6"/></svg>';
  function applySound() {
    const p = active?.player;
    if (!p?.isMuted) return;
    if (wantSound) { p.unMute(); p.setVolume(70); } else p.mute();
    setTimeout(() => {
      if (wantSound && p.getPlayerState?.() !== YT.PlayerState.PLAYING) { p.mute(); p.playVideo(); wantSound = false; }
      $("soundBtn").innerHTML = wantSound ? ICON_ON : ICON_OFF;
    }, 700);
    $("soundBtn").innerHTML = wantSound ? ICON_ON : ICON_OFF;
  }
  $("soundBtn").onclick = () => { wantSound = !wantSound; applySound(); $("soundBtn").innerHTML = wantSound ? ICON_ON : ICON_OFF; };
  $("soundBtn").innerHTML = ICON_OFF;
  // phones: show the pinned place name once the card's big title has scrolled away
  $("panel").addEventListener("scroll", () => {
    $("miniTitle").classList.toggle("show", $("panel").scrollTop > $("panelHead").offsetHeight - 8);
  }, { passive: true });

  // ---------------------------------------------------------------- the trip
  // One player at a time: the current view is retired, the frame moves into place with the
  // departures board spinning in it, and the next stream is cued (not playing) in a hidden layer.
  // When it's ready the board settles on the destination and drops away, and only then does the
  // now-visible player start. A cued stream that won't actually play falls back to loading the
  // next one directly, over the painted "tuning in" scene.
  let active = null, bg = null, busy = false, onLanding = true;
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  function clearPanel() {
    current = null;
    $("pName").textContent = "Finding a window…";
    $("miniName").textContent = ""; $("miniTitle").classList.remove("show"); $("panel").scrollTop = 0;
    ["pPlace", "pmPlace", "pmDate", "panelBody"].forEach((id) => ($(id).textContent = ""));
    ["sTime", "sWeather", "sSun", "sCoords"].forEach((id) => ($(id).textContent = "–"));
  }
  // Cues the first of the stream's sources that YouTube will serve, in a hidden layer.
  async function stage(stream) {
    for (const cand of PeekPlayer.candidates(stream)) {
      const layer = document.createElement("div");
      layer.className = "layer staged";
      $("stage").appendChild(layer);
      try { return { layer, prepared: await PeekPlayer.prepare(layer, cand, { timeout: LOAD_TIMEOUT_MS, expect: stream.expect }) }; }
      catch (err) { layer.remove(); console.warn(`[peek] ${stream.id}: ${PeekPlayer.label(cand)} failed (${err.message})`); }
    }
    throw new Error("no source would cue");
  }
  function arrive(stream, loaded) {
    active = { stream, ...loaded };
    current = stream;
    remember(stream.id);
    renderPanel(stream);
    applySound();
  }
  async function peek() {
    if (busy) return;
    busy = true;
    board.unlockAudio();   // the click is our one chance to allow sound
    const tried = [active?.stream.id, bg?.stream.id].filter(Boolean);
    retire(active); retire(bg); active = bg = null;
    $("landing").classList.add("gone");
    document.body.classList.remove("on-landing");
    $("toast").classList.remove("on");
    $("tuning").textContent = "";
    mode = "view"; layout(); clearPanel();
    $("chrome").classList.add("on");
    onLanding = false;
    const t0 = performance.now();
    await sleep(reducedMotion ? 0 : 450);   // let the frame start moving before the board fills it
    board.show();

    let next = null, staged = null;
    for (let attempt = 0; attempt < 4 && !staged; attempt++) {
      next = pick(tried);
      if (!next) break;
      tried.push(next.id);
      try { staged = await stage(next); }
      catch (err) { console.warn(`[peek] skipping ${next.id}:`, err.message); }
    }
    if (!staged) {
      await board.settle(["No departures", "Every window is fogged", "Try again shortly"]);
      await sleep(1800);
      await board.hide();
      busy = false;
      goHome();
      return;
    }
    const spun = performance.now() - t0;
    if (spun < MIN_SPIN_MS) await sleep(MIN_SPIN_MS - spun);
    current = next; renderPanel(next);   // the card fills in as the board lands
    await board.settle(boardLines(next, board.cols));
    await sleep(HOLD_MS);
    await board.hide();
    staged.layer.classList.remove("staged");

    try {
      const { player } = await PeekPlayer.start(staged.prepared, { timeout: LOAD_TIMEOUT_MS, expect: next.expect });
      arrive(next, { layer: staged.layer, player });
    } catch (err) {
      // It cued but won't play as promised (ended, not live, not HD). Recover without the board.
      console.warn(`[peek] ${next.id} wouldn't start (${err.message})`);
      staged.layer.remove();
      let loaded = null, stream = next;
      for (let attempt = 0; attempt < 3 && !loaded; attempt++) {
        if (attempt) { stream = pick(tried); if (!stream) break; tried.push(stream.id); }
        $("tuning").textContent = `Tuning in · ${stream.country}`;
        try { loaded = await loadStream(stream); } catch { /* try another */ }
      }
      $("tuning").textContent = "";
      if (loaded) arrive(stream, loaded);
      else {
        $("toast").textContent = "Every window we tried was fogged over. Try again in a moment.";
        $("toast").classList.add("on");
        busy = false;
        setTimeout(goHome, 3500);
        return;
      }
    }
    busy = false;
  }

  function goHome() {
    if (busy) return;
    $("toast").classList.remove("on");
    $("chrome").classList.remove("on");
    $("landing").classList.remove("gone");
    document.body.classList.add("on-landing");
    mode = "landing"; layout();
    onLanding = true;
    if (active) {   // the same player keeps playing, now as the poster's illustration
      active.player.mute(); bg = active; active = null; current = null;
      showCaption(bg.stream);
    } else startBackground();
  }

  // ---------------------------------------------------------------- landing background
  // The poster's illustration is a live view: one muted, daylight stream in the frame.
  function showCaption(s) {
    $("countLine").innerHTML = `<b>Now showing</b> ${esc(s.name)}, ${esc(s.country)}`;
  }
  async function startBackground() {
    await PeekPlayer.statusReady;
    const s = pick();
    if (!s || !onLanding) return;
    try {
      const loaded = await loadStream(s);
      if (!onLanding || bg || active) { retire(loaded); return; }   // the visitor already left
      bg = { stream: s, ...loaded };
      showCaption(s);
    } catch { /* the painted scene stays in the frame */ }
  }

  // ---------------------------------------------------------------- wiring
  $("peekBtn").onclick = peek;
  $("againBtn").onclick = peek;
  $("home").onclick = goHome;
  addEventListener("keydown", (e) => {
    if (e.target.closest("input,textarea")) return;
    if (e.code === "Space" || (onLanding && e.code === "Enter")) { e.preventDefault(); peek(); }
    if (e.code === "Escape" && !onLanding) goHome();
  });
  layout();
  startBackground();
})();
</script>
</body>
</html>
