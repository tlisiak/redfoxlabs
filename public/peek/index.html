<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peek</title>
<meta name="description" content="A live window somewhere beautiful on Earth, right now.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #f4f1ea;
    --ink-dim: rgba(244, 241, 234, 0.68);
    --ink-faint: rgba(244, 241, 234, 0.42);
    --glass: rgba(14, 16, 20, 0.58);
    --glass-line: rgba(255, 255, 255, 0.12);
    --void: #05060a;
    --live: #ff4d4d;
    --panel-w: 380px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--void); color: var(--ink); overflow: hidden; }
  body { font: 15px/1.55 Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  /* ---------- video layers ---------- */
  .stage { position: fixed; inset: 0; overflow: hidden; background: var(--void); }
  .layer { position: absolute; inset: 0; overflow: hidden; }
  /* Cover the viewport with a 16:9 frame, cropping whichever edge overflows. */
  .layer iframe, .layer .yt-slot {
    position: absolute; top: 50%; left: 50%;
    width: 100vw; height: 56.25vw; min-height: 100vh; min-width: 177.78vh;
    transform: translate(-50%, -50%); border: 0;
  }
  /* Shield: the viewer can look, never touch the player. */
  .layer::after { content: ""; position: absolute; inset: 0; }
  .layer.incoming { visibility: hidden; }
  .layer.revealing { visibility: visible; animation: reveal 1100ms cubic-bezier(.2,.7,.1,1) forwards; }
  @keyframes reveal {
    from { clip-path: circle(0% at 50% 50%); filter: brightness(2.2) blur(6px); }
    to   { clip-path: circle(75% at 50% 50%); filter: none; }
  }

  /* ---------- landing ---------- */
  .landing { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px 16px; transition: opacity .6s ease; }
  .landing::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(ellipse at center, rgba(5,6,10,.15) 0%, rgba(5,6,10,.55) 70%, rgba(5,6,10,.8) 100%),
      linear-gradient(to bottom, rgba(5,6,10,.35), transparent 30%, transparent 60%, rgba(5,6,10,.6));
  }
  .landing.gone { opacity: 0; pointer-events: none; }
  .hero { position: relative; max-width: 560px; }
  .wordmark { font: 300 clamp(72px, 16vw, 148px)/0.9 Fraunces, Georgia, serif; letter-spacing: -0.04em; }
  .tagline { margin: 18px auto 36px; font-size: clamp(16px, 2.2vw, 19px); color: var(--ink-dim); max-width: 26em; }
  .cta {
    display: inline-flex; align-items: center; gap: 12px;
    padding: 16px 30px; border-radius: 999px;
    background: var(--ink); color: #111; font-weight: 600; font-size: 16px; letter-spacing: .01em;
    box-shadow: 0 10px 40px rgba(0,0,0,.35), 0 0 0 0 rgba(244,241,234,.5);
    transition: transform .2s ease, box-shadow .3s ease;
    animation: breathe 3.2s ease-in-out infinite;
  }
  .cta:hover { transform: translateY(-1px) scale(1.02); }
  .cta:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
  .cta .eye { width: 18px; height: 18px; }
  @keyframes breathe { 0%,100% { box-shadow: 0 10px 40px rgba(0,0,0,.35), 0 0 0 0 rgba(244,241,234,.35); } 50% { box-shadow: 0 10px 40px rgba(0,0,0,.35), 0 0 0 12px rgba(244,241,234,0); } }
  .fine { margin-top: 22px; font-size: 13px; color: var(--ink-faint); letter-spacing: .02em; }
  .bg-caption { position: fixed; left: 20px; bottom: 18px; font-size: 12px; color: var(--ink-faint); display: flex; gap: 8px; align-items: center; transition: opacity .6s; }
  .landing.gone ~ .bg-caption { opacity: 0; }

  /* ---------- wormhole ---------- */
  #wormhole { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0; transition: opacity .45s ease; }
  #wormhole.on { opacity: 1; }

  /* ---------- viewing chrome ---------- */
  .chrome { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .6s ease .2s; }
  .chrome.on { opacity: 1; }
  .chrome > * { pointer-events: auto; }
  .mini-mark { position: absolute; top: 18px; left: 22px; font: 400 28px/1 Fraunces, Georgia, serif; letter-spacing: -0.03em; text-shadow: 0 2px 16px rgba(0,0,0,.5); }
  .again {
    position: absolute; left: 22px; bottom: 22px;
    display: inline-flex; align-items: center; gap: 10px;
    padding: 12px 20px; border-radius: 999px;
    background: var(--glass); border: 1px solid var(--glass-line);
    backdrop-filter: blur(18px) saturate(1.3); -webkit-backdrop-filter: blur(18px) saturate(1.3);
    font-weight: 500; white-space: nowrap;
  }
  .again:hover { background: rgba(14,16,20,.75); }
  .again kbd { font: 500 11px Inter, sans-serif; color: var(--ink-faint); border: 1px solid var(--glass-line); border-radius: 4px; padding: 1px 5px; }

  .panel {
    position: absolute; top: 16px; right: 16px; bottom: 16px; width: var(--panel-w);
    background: var(--glass); border: 1px solid var(--glass-line); border-radius: 20px;
    backdrop-filter: blur(22px) saturate(1.3); -webkit-backdrop-filter: blur(22px) saturate(1.3);
    display: flex; flex-direction: column; overflow: hidden;
    transition: transform .5s cubic-bezier(.2,.7,.1,1), opacity .4s;
  }
  .panel.tucked { transform: translateX(calc(100% + 16px)); opacity: 0; }
  .panel-head { padding: 22px 22px 14px; border-bottom: 1px solid var(--glass-line); }
  .live { display: inline-flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: var(--live); box-shadow: 0 0 0 0 var(--live); animation: pulse 2s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,77,77,.6); } 70% { box-shadow: 0 0 0 8px rgba(255,77,77,0); } 100% { box-shadow: 0 0 0 0 rgba(255,77,77,0); } }
  .p-name { font: 400 28px/1.12 Fraunces, Georgia, serif; letter-spacing: -0.015em; margin: 10px 0 4px; }
  .p-place { color: var(--ink-dim); font-size: 14px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin-top: 16px; }
  .stat small { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); }
  .stat span { font-size: 14px; font-variant-numeric: tabular-nums; }
  .panel-body { overflow-y: auto; padding: 6px 22px 22px; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.2) transparent; }
  .headline { font: italic 300 17px/1.45 Fraunces, Georgia, serif; color: var(--ink); margin: 16px 0 4px; }
  .sec { margin-top: 20px; }
  .sec h3 { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 8px; }
  .sec p { color: var(--ink-dim); }
  .sec ul { list-style: none; display: grid; gap: 7px; }
  .sec li { color: var(--ink-dim); padding-left: 16px; position: relative; }
  .sec li::before { content: ""; position: absolute; left: 0; top: .7em; width: 6px; height: 1px; background: var(--ink-faint); }
  .credit { margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--glass-line); font-size: 12px; color: var(--ink-faint); display: grid; gap: 6px; }
  .credit a { color: var(--ink-dim); text-decoration: none; border-bottom: 1px solid var(--glass-line); }
  .credit a:hover { color: var(--ink); }
  .tuck {
    position: absolute; top: 14px; right: 14px; width: 30px; height: 30px; border-radius: 50%;
    display: grid; place-items: center; color: var(--ink-dim);
  }
  .tuck:hover { background: rgba(255,255,255,.08); color: var(--ink); }
  .untuck {
    position: absolute; top: 18px; right: 18px; padding: 10px 16px; border-radius: 999px;
    background: var(--glass); border: 1px solid var(--glass-line); backdrop-filter: blur(18px);
    font-size: 13px; font-weight: 500; display: none;
  }
  .panel.tucked ~ .untuck { display: inline-flex; }
  .sound { position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%); width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--glass); border: 1px solid var(--glass-line); backdrop-filter: blur(18px); }

  .toast { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; color: var(--ink-dim); font-size: 15px; display: none; }
  .toast.on { display: block; }

  /* ---------- mobile: panel becomes a bottom sheet ---------- */
  @media (max-width: 760px) {
    .panel { top: auto; left: 10px; right: 10px; bottom: 10px; width: auto; max-height: 34vh; border-radius: 18px; transition: max-height .45s cubic-bezier(.2,.7,.1,1), transform .5s, opacity .4s; }
    .panel.open { max-height: 78vh; }
    .panel.tucked { transform: translateY(calc(100% + 16px)); }
    .panel-head { padding: 16px 18px 12px; cursor: pointer; }
    .panel-head::before { content: ""; display: block; width: 36px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.25); margin: -6px auto 10px; }
    .panel-body { padding: 4px 18px 18px; }
    .p-name { font-size: 23px; }
    .again { left: 50%; transform: translateX(-50%); top: 16px; bottom: auto; padding: 9px 16px; font-size: 14px; }
    .again kbd { display: none; }
    .mini-mark { top: 20px; left: 16px; font-size: 22px; }
    .sound { left: auto; right: 16px; top: 14px; bottom: auto; transform: none; width: 38px; height: 38px; }
    .untuck { top: auto; bottom: 16px; right: 50%; transform: translateX(50%); }
    .tuck { display: none; }
    .bg-caption { left: 16px; right: 16px; justify-content: center; }
  }
  @media (prefers-reduced-motion: reduce) {
    .layer.revealing { animation: fade 600ms ease forwards; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    .cta, .live i { animation: none; }
  }
</style>
</head>
<body>

<div class="stage" id="stage"></div>

<section class="landing" id="landing">
  <div class="hero">
    <h1 class="wordmark">peek</h1>
    <p class="tagline">A live window somewhere beautiful on Earth. Right now, in daylight, wherever the sun is up.</p>
    <button class="cta" id="peekBtn">
      <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      Take a peek
    </button>
    <p class="fine" id="countLine"></p>
  </div>
</section>
<div class="bg-caption" id="bgCaption"></div>

<canvas id="wormhole"></canvas>

<div class="chrome" id="chrome">
  <button class="mini-mark" id="home" aria-label="Back to start">peek</button>
  <button class="again" id="againBtn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg>
    Peek somewhere else <kbd>Space</kbd>
  </button>
  <button class="sound" id="soundBtn" aria-label="Toggle sound" title="Sound"></button>
  <aside class="panel" id="panel" aria-live="polite">
    <header class="panel-head" id="panelHead">
      <span class="live"><i></i>Live now</span>
      <h2 class="p-name" id="pName"></h2>
      <div class="p-place" id="pPlace"></div>
      <div class="stats">
        <div class="stat"><small>Local time</small><span id="sTime">–</span></div>
        <div class="stat"><small>Weather</small><span id="sWeather">–</span></div>
        <div class="stat"><small>Sun</small><span id="sSun">–</span></div>
        <div class="stat"><small>Coordinates</small><span id="sCoords">–</span></div>
      </div>
      <button class="tuck" id="tuckBtn" aria-label="Hide info">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </header>
    <div class="panel-body" id="panelBody"></div>
  </aside>
  <button class="untuck" id="untuckBtn">About this view</button>
</div>

<div class="toast" id="toast"></div>

<script src="streams.js"></script>
<script>
(() => {
  const STREAMS = window.PEEK_STREAMS;
  const MIN_WORMHOLE_MS = 1900;   // the trip should feel like a trip, even on fast loads
  const LOAD_TIMEOUT_MS = 9000;   // give up on a stream that won't start and try another
  const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = (id) => document.getElementById(id);

  // ---------------------------------------------------------------- sun math
  // Solar altitude in degrees for a given instant and place (low-precision almanac, ±0.5°).
  function sunAltitude(date, lat, lng) {
    const rad = Math.PI / 180;
    const d = date.getTime() / 86400000 - 10957.5;            // days since J2000.0
    const g = (357.529 + 0.98560028 * d) * rad;                // mean anomaly
    const q = 280.459 + 0.98564736 * d;                        // mean longitude
    const L = (q + 1.915 * Math.sin(g) + 0.02 * Math.sin(2 * g)) * rad;
    const e = (23.439 - 0.00000036 * d) * rad;                 // obliquity
    const ra = Math.atan2(Math.cos(e) * Math.sin(L), Math.cos(L));
    const dec = Math.asin(Math.sin(e) * Math.sin(L));
    const gmst = (18.697374558 + 24.06570982441908 * d) % 24;
    const ha = (gmst * 15 + lng) * rad - ra;                   // local hour angle
    return Math.asin(Math.sin(lat * rad) * Math.sin(dec) + Math.cos(lat * rad) * Math.cos(dec) * Math.cos(ha)) / rad;
  }
  // Minutes until the sun next crosses the horizon, scanning ahead in 2-minute steps.
  function nextSunEvent(lat, lng) {
    const now = Date.now(), up = sunAltitude(new Date(now), lat, lng) > -0.833;
    for (let m = 2; m <= 36 * 60; m += 2) {
      if ((sunAltitude(new Date(now + m * 60000), lat, lng) > -0.833) !== up) return { up, minutes: m };
    }
    return { up, minutes: null };                              // polar day or night
  }
  const fmtDur = (m) => (m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : `${m}m`);
  const localHour = (tz) => Number(new Intl.DateTimeFormat("en-US", { timeZone: tz, hour: "numeric", hourCycle: "h23" }).format(new Date()));
  const localTime = (tz) => new Intl.DateTimeFormat("en-US", { timeZone: tz, hour: "numeric", minute: "2-digit" }).format(new Date());

  // ---------------------------------------------------------------- picking a view
  // A view is eligible when it's worth looking at right now: inside its camera hours,
  // or with the sun no more than 6° below the horizon (civil twilight counts, it's gorgeous).
  // Golden hour gets triple weight.
  const recent = [];
  function eligible(s) {
    if (s.hours) { const h = localHour(s.tz); return h >= s.hours[0] && h < s.hours[1]; }
    return s.night || sunAltitude(new Date(), s.lat, s.lng) > -6;
  }
  function weight(s) {
    const alt = sunAltitude(new Date(), s.lat, s.lng);
    return alt > -6 && alt < 10 ? 3 : 1;
  }
  function pick(exclude = []) {
    let pool = STREAMS.filter((s) => eligible(s) && !exclude.includes(s.id));
    const fresh = pool.filter((s) => !recent.includes(s.id));
    if (fresh.length) pool = fresh;
    if (!pool.length) pool = STREAMS.filter((s) => !exclude.includes(s.id));
    if (!pool.length) return null;
    const total = pool.reduce((t, s) => t + weight(s), 0);
    let r = Math.random() * total;
    for (const s of pool) { r -= weight(s); if (r <= 0) return s; }
    return pool[pool.length - 1];
  }
  function remember(id) { recent.push(id); while (recent.length > Math.min(4, STREAMS.length - 1)) recent.shift(); }

  // ---------------------------------------------------------------- YouTube players
  const ytReady = new Promise((resolve) => {
    window.onYouTubeIframeAPIReady = () => resolve(true);
    const tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    tag.onerror = () => resolve(null);
    document.head.appendChild(tag);
  });
  const PLAYER_VARS = { autoplay: 1, mute: 1, controls: 0, disablekb: 1, fs: 0, iv_load_policy: 3, modestbranding: 1, playsinline: 1, rel: 0, cc_load_policy: 0 };
  if (location.protocol.startsWith("http")) PLAYER_VARS.origin = location.origin;

  // Builds a hidden layer and resolves with { layer, player } once video is actually playing.
  function loadStream(stream, { incoming = true } = {}) {
    return new Promise(async (resolve, reject) => {
      const api = await ytReady;
      if (!api) return reject(new Error("YouTube unavailable"));
      const layer = document.createElement("div");
      layer.className = "layer" + (incoming ? " incoming" : "");
      $("stage").appendChild(layer);
      let settled = false;
      const done = (fn, v) => { if (!settled) { settled = true; clearTimeout(timer); fn(v); } };
      const timer = setTimeout(() => { cleanup(); done(reject, new Error("timeout")); }, LOAD_TIMEOUT_MS);
      const cleanup = () => { try { player.destroy(); } catch {} layer.remove(); };
      const events = {
        onReady: (e) => { e.target.mute(); e.target.playVideo(); },
        onStateChange: (e) => { if (e.data === YT.PlayerState.PLAYING) done(resolve, { layer, player }); },
        onError: () => { cleanup(); done(reject, new Error("player error")); },
      };
      let player;
      if (stream.source.channelId) {
        // Channel embeds follow whatever the channel is broadcasting, so they survive restarts.
        const iframe = document.createElement("iframe");
        const qs = new URLSearchParams({ ...PLAYER_VARS, channel: stream.source.channelId, enablejsapi: 1 });
        iframe.src = `https://www.youtube.com/embed/live_stream?${qs}`;
        iframe.allow = "autoplay; encrypted-media";
        layer.appendChild(iframe);
        player = new YT.Player(iframe, { events });
      } else {
        const slot = document.createElement("div");
        slot.className = "yt-slot";
        layer.appendChild(slot);
        player = new YT.Player(slot, { videoId: stream.source.videoId, playerVars: PLAYER_VARS, events });
      }
    });
  }

  // ---------------------------------------------------------------- wormhole
  // A minimal tunnel: particles stream toward the viewer from a vanishing point,
  // drawn as streaks whose length grows with speed. Speed eases up, then the
  // tunnel collapses into a flash while the destination irises open.
  const canvas = $("wormhole"), ctx = canvas.getContext("2d");
  let W, H, DPR, stars = [], warp = { running: false, speed: 0, target: 0, raf: 0 };
  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 2);
    W = canvas.width = innerWidth * DPR; H = canvas.height = innerHeight * DPR;
  }
  function seed() {
    stars = Array.from({ length: 520 }, () => ({ a: Math.random() * Math.PI * 2, r: 0.15 + Math.random() * 0.85, z: Math.random(), pz: 0 }));
  }
  function frame() {
    warp.speed += (warp.target - warp.speed) * 0.045;
    ctx.fillStyle = `rgba(5,6,10,${0.32 - Math.min(warp.speed, 0.05) * 2})`;
    ctx.fillRect(0, 0, W, H);
    const cx = W / 2, cy = H / 2, R = Math.max(W, H) * 0.62, t = performance.now() / 1000;
    // faint rings receding into the throat
    ctx.lineWidth = 1 * DPR;
    for (let i = 0; i < 7; i++) {
      const z = ((i / 7 + t * warp.speed * 1.4) % 1);
      const rr = (R * 0.08) / Math.max(1 - z, 0.03);
      ctx.strokeStyle = `rgba(180,200,255,${0.07 * z})`;
      ctx.beginPath(); ctx.arc(cx, cy, rr, 0, Math.PI * 2); ctx.stroke();
    }
    for (const s of stars) {
      s.pz = s.z;
      s.z += warp.speed * (0.6 + s.r * 0.4);
      if (s.z >= 1) { s.z = s.pz = Math.random() * 0.2; s.a = Math.random() * Math.PI * 2; }
      const swirl = t * 0.25;
      const p = (z) => (R * 0.06 * s.r) / Math.max(1 - z, 0.02);
      const r0 = p(s.pz), r1 = p(s.z);
      const ang = s.a + swirl;
      const x0 = cx + Math.cos(ang) * r0, y0 = cy + Math.sin(ang) * r0;
      const x1 = cx + Math.cos(ang) * r1, y1 = cy + Math.sin(ang) * r1;
      ctx.strokeStyle = `rgba(${225 + s.r * 30},${232 + s.r * 20},255,${Math.min(1, s.z * 1.3)})`;
      ctx.lineWidth = (0.6 + s.z * 1.8) * DPR;
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    }
    // soft glow in the throat
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 0.25);
    g.addColorStop(0, `rgba(220,230,255,${0.08 + warp.speed * 1.2})`);
    g.addColorStop(1, "rgba(220,230,255,0)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    if (warp.running) warp.raf = requestAnimationFrame(frame);
  }
  function wormholeIn() {
    if (reducedMotion) { canvas.classList.add("on"); ctx.fillStyle = "#05060a"; ctx.fillRect(0, 0, W, H); return; }
    resize(); seed();
    ctx.fillStyle = "#05060a"; ctx.fillRect(0, 0, W, H);
    warp.running = true; warp.speed = 0.002; warp.target = 0.018;
    cancelAnimationFrame(warp.raf); frame();
    canvas.classList.add("on");
  }
  function wormholeOut() {
    warp.target = 0.06;                                         // final lunge
    setTimeout(() => canvas.classList.remove("on"), 260);
    setTimeout(() => { warp.running = false; cancelAnimationFrame(warp.raf); }, 800);
  }
  addEventListener("resize", () => { if (warp.running) resize(); });

  // ---------------------------------------------------------------- info panel
  let current = null, clockTimer = 0;
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  function renderPanel(s) {
    $("pName").textContent = s.name;
    $("pPlace").textContent = `${s.place} · ${s.country}`;
    const ns = s.lat >= 0 ? "N" : "S", ew = s.lng >= 0 ? "E" : "W";
    $("sCoords").innerHTML = `<a href="https://www.google.com/maps/@${s.lat},${s.lng},12z" target="_blank" rel="noopener" style="text-decoration:none">${Math.abs(s.lat).toFixed(2)}°${ns}, ${Math.abs(s.lng).toFixed(2)}°${ew}</a>`;
    $("sWeather").textContent = "–";
    const list = (items) => `<ul>${items.map((i) => `<li>${esc(i)}</li>`).join("")}</ul>`;
    $("panelBody").innerHTML = `
      <p class="headline">${esc(s.headline)}</p>
      <div class="sec"><h3>What you're looking at</h3><p>${esc(s.looking)}</p></div>
      <div class="sec"><h3>Watch for</h3>${list(s.watchFor)}</div>
      <div class="sec"><h3>The story</h3><p>${esc(s.history)}</p></div>
      ${s.facts?.length ? `<div class="sec"><h3>Worth knowing</h3>${list(s.facts)}</div>` : ""}
      <div class="credit">
        <div>Live stream by <a href="${s.credit.url}" target="_blank" rel="noopener">${esc(s.credit.name)}</a></div>
        <div>Sources: ${s.sources.map((x) => `<a href="${x.url}" target="_blank" rel="noopener">${esc(x.label)}</a>`).join(" · ")}</div>
      </div>`;
    $("panelBody").scrollTop = 0;
    tick();
    clearInterval(clockTimer); clockTimer = setInterval(tick, 20000);
    loadWeather(s);
  }
  function tick() {
    if (!current) return;
    const s = current;
    $("sTime").textContent = localTime(s.tz);
    const ev = nextSunEvent(s.lat, s.lng);
    $("sSun").textContent = ev.minutes == null ? (ev.up ? "Up all day" : "Down all day") : `${ev.up ? "Sets" : "Rises"} in ${fmtDur(ev.minutes)}`;
  }
  // WMO weather codes → words (Open-Meteo uses them)
  const WMO = { 0: "Clear", 1: "Mostly clear", 2: "Partly cloudy", 3: "Overcast", 45: "Fog", 48: "Fog", 51: "Drizzle", 53: "Drizzle", 55: "Drizzle", 61: "Light rain", 63: "Rain", 65: "Heavy rain", 71: "Light snow", 73: "Snow", 75: "Heavy snow", 77: "Snow", 80: "Showers", 81: "Showers", 82: "Downpour", 85: "Snow showers", 86: "Snow showers", 95: "Thunderstorm", 96: "Thunderstorm", 99: "Thunderstorm" };
  async function loadWeather(s) {
    try {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${s.lat}&longitude=${s.lng}&current=temperature_2m,weather_code&temperature_unit=fahrenheit`;
      const res = await fetch(url);
      const j = await res.json();
      if (current !== s) return;
      const f = Math.round(j.current.temperature_2m), c = Math.round((f - 32) * 5 / 9);
      $("sWeather").textContent = `${f}°F · ${WMO[j.current.weather_code] ?? ""}`.replace(/ · $/, "");
      $("sWeather").title = `${c}°C`;
    } catch { /* weather is a nice-to-have */ }
  }

  // ---------------------------------------------------------------- sound
  // Browsers only allow audible autoplay after a gesture. The "Take a peek" click counts,
  // so we try to unmute; if the browser pushes back, we stay muted and the toggle shows it.
  let wantSound = true;
  const ICON_ON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 010 7M18.5 5.5a9 9 0 010 13"/></svg>';
  const ICON_OFF = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M22 9l-6 6M16 9l6 6"/></svg>';
  function applySound() {
    const p = active?.player;
    if (!p?.isMuted) return;
    if (wantSound) { p.unMute(); p.setVolume(70); } else p.mute();
    setTimeout(() => {
      if (wantSound && p.getPlayerState?.() !== YT.PlayerState.PLAYING) { p.mute(); p.playVideo(); wantSound = false; }
      $("soundBtn").innerHTML = wantSound ? ICON_ON : ICON_OFF;
    }, 700);
    $("soundBtn").innerHTML = wantSound ? ICON_ON : ICON_OFF;
  }
  $("soundBtn").onclick = () => { wantSound = !wantSound; applySound(); };

  // ---------------------------------------------------------------- the trip
  let active = null, busy = false, onLanding = true;
  async function peek() {
    if (busy) return;
    busy = true;
    const started = performance.now();
    wormholeIn();
    $("landing").classList.add("gone");
    $("chrome").classList.remove("on");
    $("toast").classList.remove("on");

    const tried = active ? [active.stream.id] : [];
    if (bg) tried.push(bg.stream.id);
    let next = null, loaded = null;
    for (let attempt = 0; attempt < 4 && !loaded; attempt++) {
      next = pick(tried);
      if (!next) break;
      tried.push(next.id);
      try { loaded = await loadStream(next); }
      catch (err) { console.warn(`[peek] skipping ${next.id}:`, err.message); }
    }
    const wait = MIN_WORMHOLE_MS - (performance.now() - started);
    if (wait > 0) await new Promise((r) => setTimeout(r, wait));

    if (!loaded) {
      wormholeOut();
      $("toast").textContent = "Every window we tried was fogged over. Try again in a moment.";
      $("toast").classList.add("on");
      setTimeout(goHome, 3500);
      busy = false; return;
    }

    // swap: iris the new view open, retire whatever was showing before
    const old = active, oldBg = bg;
    active = { stream: next, ...loaded };
    current = next;
    remember(next.id);
    renderPanel(next);
    loaded.layer.classList.remove("incoming");
    loaded.layer.classList.add("revealing");
    wormholeOut();
    setTimeout(() => {
      [old, oldBg].forEach((o) => { if (o) { try { o.player.destroy(); } catch {} o.layer.remove(); } });
      bg = null;
    }, 1200);
    $("chrome").classList.add("on");
    applySound();
    onLanding = false; busy = false;
  }

  function goHome() {
    if (busy) return;
    $("toast").classList.remove("on");
    $("chrome").classList.remove("on");
    $("landing").classList.remove("gone");
    if (active) {
      active.player.mute(); bg = active; active = null; current = null;
      $("bgCaption").innerHTML = `<span class="live"><i></i>Live</span> ${esc(bg.stream.name)}, ${esc(bg.stream.country)}`;
    }
    onLanding = true; busy = false;
    if (!bg) startBackground();
  }

  // ---------------------------------------------------------------- landing background
  // The landing page itself is a live view: a muted, daylight stream behind the hero.
  let bg = null;
  async function startBackground() {
    const s = pick();
    if (!s) return;
    try {
      const loaded = await loadStream(s, { incoming: false });
      loaded.layer.style.opacity = 0; loaded.layer.style.transition = "opacity 1.6s ease";
      requestAnimationFrame(() => (loaded.layer.style.opacity = 1));
      bg = { stream: s, ...loaded };
      $("bgCaption").innerHTML = `<span class="live"><i></i>Live</span> ${esc(s.name)}, ${esc(s.country)}`;
    } catch { /* the gradient alone still looks fine */ }
  }

  // ---------------------------------------------------------------- wiring
  $("countLine").textContent = `${STREAMS.length} live views · ${new Set(STREAMS.map((s) => s.country)).size} countries · only where it's light out`;
  $("peekBtn").onclick = peek;
  $("againBtn").onclick = peek;
  $("home").onclick = goHome;
  $("tuckBtn").onclick = () => $("panel").classList.add("tucked");
  $("untuckBtn").onclick = () => $("panel").classList.remove("tucked");
  $("panelHead").onclick = (e) => { if (innerWidth <= 760 && !e.target.closest("a,button")) $("panel").classList.toggle("open"); };
  addEventListener("keydown", (e) => {
    if (e.target.closest("input,textarea")) return;
    if (e.code === "Space" || (onLanding && e.code === "Enter")) { e.preventDefault(); peek(); }
    if (e.code === "Escape" && !onLanding) goHome();
  });
  resize();
  startBackground();
})();
</script>
</body>
</html>
